services:
  db:
    image: postgres:16-alpine
    container_name: idm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: idm
      POSTGRES_PASSWORD: idm_dev_password
      POSTGRES_DB: idm_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - idm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idm -d idm_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: idm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://idm:idm_dev_password@db:5432/idm_ecommerce
      JWT_SECRET_KEY: change-me-in-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  idm_pgdata:
